[versions]
# Core build and tooling
agp = "9.3.1"
kotlin = "2.4.10"
# 1.12 at least: `ImageComposeScene.calculateContentSize()`, which the screenshot
# harness this library's tests are built on uses, lands there. See the README for
# what that means for a consumer.
composeMultiplatform = "1.12.1"
dokka = "2.1.0"

# Android
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"
androidx-activity = "1.13.0"

# Icons — Kontour Labs' build of Tabler, every icon of the release named,
# outline and filled. On GitHub Packages, so reading it needs credentials: see
# `settings.gradle.kts`. The version is Tabler's own. The library draws its
# system icons from it; the catalog, the samples and the docs use the rest.
tabler-icons = "3.49.0"

# Navigation 3 — `:ui-nav3` only. The scene API is JetBrains' multiplatform
# build of it; `NavEntry` and the rest of the runtime come from Google's.
navigation3 = "1.1.1"

# The back pipeline every platform shares — the Android back gesture, iOS's
# edge pan, Escape on the desktop and the web. Compose UI brings it already, but
# only at runtime on the desktop, so `:ui` names it to compile against it.
navigationevent = "1.1.0"

# KotlinX
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-browser = "0.5.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

# Compose Foundation and nothing above it. Material is absent on purpose and
# `:ui:checkNoMaterial` fails the build if it ever arrives transitively.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

tabler-icons-outline = { module = "io.kontour:tabler-icons-outline", version.ref = "tabler-icons" }
tabler-icons-filled = { module = "io.kontour:tabler-icons-filled", version.ref = "tabler-icons" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }

[bundles]
icons = [
    "tabler-icons-outline",
    "tabler-icons-filled",
]

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
