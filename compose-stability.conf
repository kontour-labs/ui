// Types the Compose compiler cannot prove stable, and which are.
//
// Strong skipping is on, so an unstable parameter is not skipped-never — it is
// compared by *instance identity*. That is the trap: a caller that writes
// `LocalDate(year, month, 1)` or `today()` inline hands a fresh instance every
// recomposition, and the whole calendar re-runs even though the date is the same
// day. Compared by `equals` instead, it skips.
//
// Every type here is immutable and has a value `equals`. kotlinx.datetime is not
// annotated because it does not depend on Compose, which is the usual reason a
// perfectly stable type shows up as unstable.
kotlinx.datetime.*

// Immutable, value-equal, and in the standard library rather than in Compose —
// same reason as above.
kotlin.ranges.IntRange
kotlin.ranges.LongRange
kotlin.ranges.CharRange
