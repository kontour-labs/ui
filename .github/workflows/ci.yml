# Builds, tests, publishes the design system, and deploys its documentation.
#
# One workflow, and it used to be two. `pages.yml` had its own checkout, its own
# Gradle setup and its own Dokka run, which meant the API reference was generated
# twice on every commit — once in `targets`, which uploaded it as an artifact,
# and again in the site build, which could not reach that artifact because it
# was in a different workflow. Merging them is what makes the reference a thing
# built once by the job that publishes it.
#
# Jobs, separate because they fail for different reasons and at different speeds:
#
#   changes  decides what a push has to run: nothing a run has already
#            passed with the same inputs
#   test     the one that catches a regression; the catalog's slow classes
#            only on a manual run with **full** ticked
#   targets  the one that catches a component compiling on the JVM and nowhere
#            else, and the public API moving
#   site     the documentation site and the API reference, and the slowest thing here
#   deploy   uploads the site to Cloudflare Pages, docs.kontour.io/ui
#   publish  uploads the library to Maven Central, for a release only
#   renders  contact sheets of every page, when somebody asks
#
# `deploy` needs only `site`, deliberately: a library regression should not take
# the documentation offline, and a broken page should not block a release.
#
# ### When it runs
#
# Pushes to `main`, `v*` tags, and by hand. **Not** on pull requests or on
# pushes to any other branch. The runners are GitHub's own, free for a public
# repository; it is still about 17 minutes of `test` alone for a pull request,
# which is a long wait for an answer nobody asked for yet.
# A branch that wants the checks before it merges asks for them: Actions → CI →
# Run workflow, on that branch, with **full** ticked for the catalog's slow
# classes. That run never deploys.
#
# ### The slow classes
#
# The catalog suite was about 83 minutes of test time, which is 45 minutes of
# `test` on these runners, and 26 classes were 70 of those minutes. They are
# marked `@Category(Slow::class)` and run only when **full** is ticked, or
# locally with `-Pkontour.tests.full=true`. What is left is the libraries'
# suites, every golden except the phone pages, and most of the catalog's
# behaviour tests.
#
# Branch protection must therefore not require status checks from pull
# requests, or every merge waits for a check that never starts.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish this version to Maven Central (e.g. 0.1.0). Leave blank to
          run the checks only. Use this to cut a release from a branch, where
          `GITHUB_REF_NAME` is a branch name and the build refuses it.
        required: false
        default: ''
      full:
        description: >-
          Run the catalog's slow tests as well: the sweeps over every
          component, width and setting, and the long gesture suites. About
          70 of the suite's 83 minutes of test time, and off on every push.
          Tick it before merging a change to how components lay out, move or
          take input.
        type: boolean
        required: false
        default: false
      renders:
        description: >-
          Draw every page of the site at four widths and upload the contact
          sheets. Off by default: it is 488 renders and it used to be 90% of
          this workflow's bill.
        type: boolean
        required: false
        default: false

# Read-only by default. The one job that writes to GitHub, `publish`, says so
# itself. `deploy` writes to Cloudflare with its own token and needs nothing
# here.
permissions:
  contents: read
  # The icons, `io.kontour:tabler-icons-*`, are read from GitHub Packages, which
  # wants credentials even to read, for as long as a version is there and not on
  # Maven Central. See `env` below, and `settings.gradle.kts`.
  packages: read

# What `settings.gradle.kts` reads the icons with. A `KONTOUR_PACKAGES_*` pair
# from the repository's secrets where it has one; otherwise this run's own
# token, which reads the package where the package grants this repository
# Actions access (the package's settings, under "Manage Actions access").
env:
  KONTOUR_PACKAGES_ACTOR: ${{ secrets.KONTOUR_PACKAGES_ACTOR || github.actor }}
  KONTOUR_PACKAGES_TOKEN: ${{ secrets.KONTOUR_PACKAGES_TOKEN || github.token }}

# `main` and tags are never cancelled. The last push to land should be the one
# that ends up published, and cancelling a deploy in flight can leave a newer
# build racing an older one. A manual run of the checks on a branch is
# different: asking again means the last answer is no longer wanted, so the
# new run cancels the old one rather than paying for both. A run that
# publishes is in a group of its own, so it is never the one cancelled: a
# package registry has no undo for half an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.version && '-publish' || '' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && !inputs.version }}

jobs:
  # What this push has to run.
  #
  # ### Nothing twice
  #
  # Each gate has a **fingerprint**: a hash of the git trees of exactly the
  # directories it reads, and of everything at the top of the repository that
  # every build reads — `buildSrc/`, `gradle/`, the build scripts, this file.
  #
  #   checks   the Python checks: the whole tree, since between them they read
  #            all of it
  #   library  `ui/`, `ui-nav3/`, `haptics/`: their own suites
  #   catalog  those and `ui-catalog/`: the catalog's suite and its goldens
  #   docs     those and `ui-samples/`, `ui-docs/`, `docs/`, the README: the
  #            documentation's tests and the site
  #   targets  the libraries, `ui-catalog/` and `showcase/`: every target's
  #            compile and the public API
  #
  # A gate that passes leaves a marker named after its fingerprint,
  # `passed-<gate>-<fingerprint>`, and a push looks for each before it starts.
  # One that is there has passed for these very inputs, and is not run again.
  #
  # It used to be one marker for the whole tree, left only by a run that had
  # done everything, and a push to `main` tested only what its files could
  # break. So a merge that touched the catalog and the docs tested those, left
  # no marker — it had not tested the libraries — and the release tag on the
  # same commit found nothing and tested everything again: 16 minutes on
  # `main` and 17 more on `v0.4.0`, for one tree. Now the merge leaves markers
  # for what it tested, the libraries' marker from the push that last changed
  # them still stands, and the tag finds all of them and tests nothing.
  #
  # The site is the same idea with the build itself: its bundle is uploaded as
  # `bundle-<docs fingerprint>`, and `site-<docs fingerprint>-<release>` is
  # what `deploy` uploads. The release (`kontourDocsVersion` in buildSrc) is
  # the one input to the site that is not in the tree, and it reaches only
  # the API reference — so a tag rebuilds the reference and lays the site out
  # again round the bundle `main` built, and compiles none of it.
  #
  # **Whether to deploy** is still asked of the files a push to `main`
  # changed: the site that is live is the last one deployed, which no marker
  # can say. A tag deploys, for the version.
  #
  # A manual run skips nothing, because asking is the point of it; its
  # markers still count for the pushes after it. A failed lookup finds
  # nothing and runs the gate, which is the direction this must fail in.
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    # Minutes, except on a tag that has to wait for `main`: see below.
    timeout-minutes: 45
    permissions:
      contents: read
      # To look the markers up.
      actions: read
    outputs:
      checks: ${{ steps.passed.outputs.checks }}
      library: ${{ steps.passed.outputs.library }}
      catalog: ${{ steps.passed.outputs.catalog }}
      docs: ${{ steps.passed.outputs.docs }}
      targets: ${{ steps.passed.outputs.targets }}
      test: ${{ steps.passed.outputs.test }}
      checks-fp: ${{ steps.keys.outputs.checks-fp }}
      library-fp: ${{ steps.keys.outputs.library-fp }}
      catalog-fp: ${{ steps.keys.outputs.catalog-fp }}
      docs-fp: ${{ steps.keys.outputs.docs-fp }}
      targets-fp: ${{ steps.keys.outputs.targets-fp }}
      bundle-name: ${{ steps.keys.outputs.bundle-name }}
      bundle-run: ${{ steps.passed.outputs.bundle-run }}
      site-name: ${{ steps.keys.outputs.site-name }}
      site-run: ${{ steps.passed.outputs.site-run }}
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      # For the release the site would be labelled with: see `site`.
      - name: Fetch the release tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'

      # A tag put on `main`'s commit while `main`'s run of it is still going
      # would find none of that run's markers yet, and test everything again
      # beside it. So it waits for that run to finish first: one runner
      # idling, against every job running twice. Forty minutes at most, and a
      # lookup that fails stops waiting.
      - name: Wait for main's run of this commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 80); do
            busy=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&per_page=20" --jq \
              "[.workflow_runs[] | select(.id != $RUN and .head_branch == \"main\"
                and .path == \".github/workflows/ci.yml\" and .status != \"completed\")] | length" 2>/dev/null) || break
            [ "${busy:-0}" -gt 0 ] || break
            [ "$attempt" = 1 ] && echo "main's run of ${SHA:0:7} is still going: waiting for its markers."
            sleep 30
          done

      - id: keys
        name: Name what this tree would have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }

          # Everything at the top that is not one gate's own: the build, and
          # anything added there later, which counts for every gate until it
          # is placed. The README, the changelog and the IDE's run
          # configurations are read by nothing Gradle runs.
          own='ui|ui-nav3|haptics|ui-catalog|ui-samples|ui-docs|showcase|docs|README\.md|CHANGELOG\.md|\.run|\.gitignore'
          shared=$(git ls-tree --name-only HEAD | grep -vxE "$own")
          fingerprint() {
            for path in $shared "$@"; do
              echo "$path $(git rev-parse --verify --quiet "HEAD:$path" || echo absent)"
            done | sha256sum | cut -c1-20
          }
          declare -A fp=(
            [checks]=$(git rev-parse 'HEAD^{tree}')
            [library]=$(fingerprint ui ui-nav3 haptics)
            [catalog]=$(fingerprint ui ui-nav3 haptics ui-catalog)
            [docs]=$(fingerprint ui ui-nav3 haptics ui-catalog ui-samples ui-docs docs README.md)
            [targets]=$(fingerprint ui ui-nav3 haptics ui-catalog showcase docs/check-xcode-host.py)
          )

          for gate in checks library catalog docs targets; do out "$gate-fp=${fp[$gate]}"; done
          out "bundle-name=bundle-${fp[docs]}"
          out "site-name=site-${fp[docs]}-$(.github/docs-release.sh)"

      # Each marker, the bundle and the site are entries in the Actions cache,
      # looked up without being downloaded. They were artifacts, and artifacts
      # shared one storage quota with the published packages while the
      # repository was private: when it filled, nothing could be uploaded, and
      # the site had no way to reach `deploy`. The cache has a quota of its own. A manual
      # run looks nothing up, because asking is the point of it.
      - id: hit-checks
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: passed.txt, key: "passed-checks-${{ steps.keys.outputs.checks-fp }}", lookup-only: true }
      - id: hit-library
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: passed.txt, key: "passed-library-${{ steps.keys.outputs.library-fp }}", lookup-only: true }
      - id: hit-catalog
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: passed.txt, key: "passed-catalog-${{ steps.keys.outputs.catalog-fp }}", lookup-only: true }
      - id: hit-docs
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: passed.txt, key: "passed-docs-${{ steps.keys.outputs.docs-fp }}", lookup-only: true }
      - id: hit-targets
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: passed.txt, key: "passed-targets-${{ steps.keys.outputs.targets-fp }}", lookup-only: true }
      - id: hit-bundle
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: |
            ui-docs/build/dist/wasmJs/productionExecutable
            ui-docs/build/generated/apiTables/ApiTables.kt
          key: ${{ steps.keys.outputs.bundle-name }}
          lookup-only: true
      - id: hit-site
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with: { path: dist, key: "${{ steps.keys.outputs.site-name }}", lookup-only: true }

      - id: passed
        name: Look for what has passed already
        env:
          CHECKS: ${{ steps.hit-checks.outputs.cache-hit }}
          LIBRARY: ${{ steps.hit-library.outputs.cache-hit }}
          CATALOG: ${{ steps.hit-catalog.outputs.cache-hit }}
          DOCS: ${{ steps.hit-docs.outputs.cache-hit }}
          TARGETS: ${{ steps.hit-targets.outputs.cache-hit }}
          BUNDLE: ${{ steps.hit-bundle.outputs.cache-hit }}
          SITE: ${{ steps.hit-site.outputs.cache-hit }}
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          declare -A hit=([checks]=$CHECKS [library]=$LIBRARY [catalog]=$CATALOG [docs]=$DOCS [targets]=$TARGETS)
          test=false
          for gate in checks library catalog docs targets; do
            if [ "${hit[$gate]}" = true ]; then
              out "$gate=false"
              say "\`$gate\` has passed for these inputs: not running it again."
            else
              out "$gate=true"
              say "\`$gate\` has not passed for these inputs: running it."
              [ "$gate" = targets ] || test=true
            fi
          done
          out "test=$test"
          if [ "$BUNDLE" = true ]; then
            out "bundle-run=cache"
            say "The site's bundle for these inputs is built: laying the site out round it."
          fi
          if [ "$SITE" = true ]; then
            out "site-run=cache"
            say "The site for these inputs and this release is built: deploying that."
          fi

      # Whether the site that is live is out of date. Only a push to `main`
      # can answer no, from the files it changed; anything it cannot answer
      # for certain answers yes.
      - id: deploy
        name: Decide whether to deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          yes() { echo "deploy=true" >> "$GITHUB_OUTPUT"; say "$1 The site is deployed if it builds."; exit 0; }

          [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] || yes "A $EVENT on $REF."
          [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] ||
            yes "No previous main to compare with."
          compare=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" 2>/dev/null) ||
            yes "Could not compare ${BEFORE:0:7} with ${SHA:0:7}."
          [ "$(jq -r .status <<<"$compare")" = ahead ] ||
            yes "main did not move forwards from ${BEFORE:0:7}."
          [ "$(jq '.files | length' <<<"$compare")" -lt 300 ] ||
            yes "More files changed than the API lists."

          # A rename counts at both ends.
          changed=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$compare")
          grep -qvE '^(showcase/|README\.md$|CHANGELOG\.md$|\.run/|\.gitignore$)' <<<"$changed" ||
            { echo "deploy=false" >> "$GITHUB_OUTPUT"; say "Nothing the site is made from changed since ${BEFORE:0:7}: not deploying."; exit 0; }
          yes "The site's inputs changed since ${BEFORE:0:7}."

  # Every gated job reads `changes` the same way: run when it says so, *or*
  # when it did not succeed. A failed dependency skips its dependants by
  # default, and a skipped test job is the one direction this must never fail
  # in — so `!cancelled()`, and a `changes` that failed means everything.
  #
  # `timeout-minutes` on every job, because the default is six hours and a
  # runner that has stopped answering bills every one of them: see the note on
  # memory under `test`'s Gradle step. Each is about twice the job's ordinary
  # length.
  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    runs-on: ubuntu-latest
    # The slow classes are most of an hour on their own.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 90 || 40 }}
    env:
      CHECKS: ${{ needs.changes.result != 'success' || needs.changes.outputs.checks == 'true' }}
      LIBRARY: ${{ needs.changes.result != 'success' || needs.changes.outputs.library == 'true' }}
      CATALOG: ${{ needs.changes.result != 'success' || needs.changes.outputs.catalog == 'true' }}
      DOCS: ${{ needs.changes.result != 'success' || needs.changes.outputs.docs == 'true' }}
      # The catalog's `@Category(Slow::class)` classes, only when asked for.
      FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    steps:
      - uses: actions/checkout@v4

      # First, because they are seconds. They run for every tree that has not
      # passed them, and one of them is what holds the README's counts.
      - name: Check the docs' links resolve
        if: env.CHECKS == 'true'
        run: python3 docs/check-links.py

      # Ten rules over the documentation: a page per public component, an index
      # entry, an interactive demo, a compiled example, accessibility notes, and
      # a README whose component count is the tree's.
      - name: Check every component has a page
        if: env.CHECKS == 'true'
        run: python3 docs/check-components.py

      # The source patterns that break high contrast, reduced motion and
      # localisation one call site at a time, each with a named allow-list.
      - name: Check components honour the reader's settings
        if: env.CHECKS == 'true'
        run: python3 docs/check-settings.py
      - name: Check every string has its English for translators
        if: env.CHECKS == 'true'
        run: python3 docs/export-strings.py --check

      # The Markdown mirror agents read, without building the site: every page
      # mirrored, `llms.txt` listing each exactly once.
      - name: Check the text mirror
        if: env.CHECKS == 'true'
        run: python3 docs/lay-out-site.py --text-only --out build/text-mirror

      - uses: actions/setup-java@v4
        if: env.LIBRARY == 'true' || env.CATALOG == 'true' || env.DOCS == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # Saves the Gradle home only from a run that did everything. The action
      # prunes what a run did not touch before saving, so a documentation-only
      # push used to replace this job's cache with one that held the docs'
      # outputs and nothing else, and the next full run started cold: the
      # v0.3.0 tag found 9 of its 200 tasks in the cache.
      - uses: gradle/actions/setup-gradle@v4
        if: env.LIBRARY == 'true' || env.CATALOG == 'true' || env.DOCS == 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || env.LIBRARY != 'true' || env.CATALOG != 'true' || env.DOCS != 'true' }}

      # The Android SDK is preinstalled on the runner and Gradle finds it through
      # ANDROID_HOME. `local.properties` is a developer file and is gitignored,
      # so nothing here may rely on it.
      - name: Check the Android SDK is present
        if: env.LIBRARY == 'true'
        run: test -d "${ANDROID_HOME:?ANDROID_HOME is unset}/platforms"

      # Unit tests, the structural guards, the screenshot goldens and every page
      # of the site at four widths. The goldens *compare* — a rendering change
      # fails here rather than turning up as an untracked file nobody looks at.
      #
      # Still named explicitly rather than run via `check`, but no longer because
      # `check` is broken — `:ui`'s buildscript now disables the web test tasks
      # and the Compose configuration check that existed to say they would not
      # work, and explains why. `check` would reach `kotlinNpmInstall` and set up
      # a browser test environment for tests this suite does not run, which is a
      # minute of runner time for nothing. This list is the same work without it.
      # **The JVM only.** `checkKotlinAbi` and the Android host tests used to be
      # here too, and the ABI check compiles every target to read its klib:
      # Kotlin/Native for both iOS targets, inside Gradle's own JVM, then JS and
      # Wasm — what `targets` compiles anyway, which now runs them.
      #
      # **Compile, then test, in two invocations**, for memory. This runner has
      # 7 GB. Run as one, the build overlapped the Kotlin daemon (2.8 GB once it
      # had compiled `:ui`), Gradle (2.3 GB with Kotlin/Native in it) and two
      # test forks with their Skia (1.5 GB), 6.8 GB measured on two cores. A
      # machine that size swaps, the forks' collectors walk swapped heaps, and
      # the 0.4.0 checks ran past an hour before they were cancelled, on a runner
      # too busy to report back: its log was never uploaded. So the compile runs
      # first, the Kotlin daemon is stopped, and the tests get the memory it
      # held: 4.5 GB at most compiling and 5.0 GB testing, measured the same
      # way, and 16 minutes rather than 21. The second invocation costs its
      # own startup and task graph, about fifteen seconds, which is why this
      # used to be one.
      #
      # `:ui-samples` answers a different question from the rest — `compileKotlinJvm`
      # asks whether the documentation examples still work against the real API,
      # `checkDocSamples` whether the copy on the page is still the code that was
      # compiled — but nothing about that needs its own process.
      #
      # Naming tasks rather than running `check` is why `checkScreenshotAssertions`
      # has to be listed: `:ui-catalog:check` never runs here. Its sibling
      # `checkGoldenOrphans` does not, because it is a finalizer of
      # `:ui-catalog:jvmTest` and arrives with it.
      #
      # Assembled from what `changes` found, in three groups: the libraries'
      # own suites, the catalog's screenshots, and what the documentation is
      # checked by. Each runs only when its inputs have not passed already.
      - name: Test
        if: env.LIBRARY == 'true' || env.CATALOG == 'true' || env.DOCS == 'true'
        run: |
          compile=()
          tasks=()
          if [ "$LIBRARY" = true ]; then
            compile+=(:ui:jvmTestClasses :ui-nav3:jvmTestClasses :haptics:jvmTestClasses)
            tasks+=(
              :ui:jvmTest :ui:checkNoMaterial :ui:checkApiConventions
              :ui-nav3:jvmTest :ui-nav3:checkNoMaterial :haptics:jvmTest :haptics:checkNoCompose
            )
          fi
          if [ "$CATALOG" = true ]; then
            compile+=(:ui-catalog:jvmTestClasses)
            tasks+=(:ui-catalog:jvmTest :ui-catalog:checkScreenshotAssertions)
            # Without it, the 26 slow classes are left out: see `Slow`.
            if [ "$FULL" = true ]; then
              tasks=(-Pkontour.tests.full=true "${tasks[@]}")
            fi
          fi
          if [ "$DOCS" = true ]; then
            compile+=(:ui-docs:jvmTestClasses :ui-samples:compileKotlinJvm)
            # `checkKdocSamples` holds the KDoc's samples to the pages, so it
            # is the docs' check: it reads them, and the README.
            tasks+=(:ui-docs:jvmTest :ui-samples:checkDocSamples :ui:checkKdocSamples)
          fi
          echo "${compile[*]}"
          ./gradlew --no-daemon "${compile[@]}"
          pkill -f '[K]otlinCompileDaemon' || true
          echo "${tasks[*]}"
          ./gradlew --no-daemon "${tasks[@]}"

      # A real window under a real pointer: the one cursor check that reaches the
      # screen. It needs a display, which the runner does not have until
      # `xvfb-run` gives it one — so it is its own task, and never part of the
      # headless `jvmTest` above.
      - name: Test the cursors on a real window
        if: env.LIBRARY == 'true'
        run: xvfb-run -a ./gradlew --no-daemon :ui:jvmOnScreenTest

      # The markers `changes` looks for, one for each gate this job ran: these
      # inputs passed it. Only once everything above has passed, and only
      # with fingerprints to name them by — a `changes` that failed ran
      # everything and vouches for nothing. Cache entries, not artifacts: see
      # `changes`. One unused for a week is evicted, and its gate runs again.
      - id: passed
        name: Mark what passed
        if: needs.changes.result == 'success'
        run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > passed.txt
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.passed.outcome == 'success' && env.CHECKS == 'true'
        with: { path: passed.txt, key: "passed-checks-${{ needs.changes.outputs.checks-fp }}" }
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.passed.outcome == 'success' && env.LIBRARY == 'true'
        with: { path: passed.txt, key: "passed-library-${{ needs.changes.outputs.library-fp }}" }
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.passed.outcome == 'success' && env.CATALOG == 'true'
        with: { path: passed.txt, key: "passed-catalog-${{ needs.changes.outputs.catalog-fp }}" }
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.passed.outcome == 'success' && env.DOCS == 'true'
        with: { path: passed.txt, key: "passed-docs-${{ needs.changes.outputs.docs-fp }}" }

      # Without this a golden failure is a percentage in a log. With it you can
      # download the render and the highlighted diff and see what moved.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshot-diffs
          path: ui-catalog/build/screenshot-diffs/
          if-no-files-found: ignore
          retention-days: 1

      # The failures themselves, written into the run's summary, where they
      # can be read without downloading anything and cost no storage.
      - name: Say what failed
        if: failure()
        run: python3 .github/failed-tests.py >> "$GITHUB_STEP_SUMMARY"

  targets:
    name: Compile every target
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.targets == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Konan pulls a compiler and a platform klib set per target and neither is
      # in the Gradle cache, so without this the iOS compile re-downloads
      # hundreds of megabytes on every run — which is most of this job's time.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The iOS host is the one thing here nothing can build: linking a framework
      # needs Xcode. So its project file is checked structurally instead — every
      # reference resolves, every Swift file is compiled, the framework it links
      # is the one `:ui-catalog` names — which is the half that rots. First in
      # this job because it is instantaneous and the compiles are not.
      - name: Check the iOS host's Xcode project
        run: python3 docs/check-xcode-host.py

      # The whole point of the module. A component that compiles on the JVM and
      # not on Wasm ships broken, and `commonMain` will not say which — only the
      # per-target compile does.
      #
      # iOS compiles to a klib here; linking a framework and running a simulator
      # needs macOS, which is a slower job than this gate should be.
      #
      # Both iOS targets, not just the device one. The **simulator** target is
      # what `showcase/ios` builds against when it runs on a laptop, and until
      # the host existed nothing compiled it anywhere — a `iosSimulatorArm64`
      # source set could have been broken for months without a red build. It is
      # nearly free: Linux, klib only, and `~/.konan` is already warm from the
      # line above.
      #
      # `checkKotlinAbi` holds each library's public API to the dump checked in
      # under its `api/` directory. A change it catches is either a mistake or a
      # deliberate break, and a deliberate one is `updateKotlinAbi` in the same
      # commit, a line under Unreleased in ui-docs/content/changelog.md, and its
      # step in ui-docs/content/migrating.md. Here rather than in `test`
      # because it reads the klib of every target, and this is the job that
      # compiles them. So are the Android host tests, which need the Android
      # compile `:ui:assemble` already does. They are last, because `--tests`
      # filters the task named before it.
      - name: Compile
        run: |
          ./gradlew --no-daemon \
            :ui:compileKotlinJs \
            :ui:compileKotlinWasmJs \
            :ui:compileKotlinIosArm64 \
            :ui:compileKotlinIosSimulatorArm64 \
            :ui-catalog:compileKotlinIosArm64 \
            :ui-catalog:compileKotlinIosSimulatorArm64 \
            :ui-nav3:compileKotlinJs \
            :ui-nav3:compileKotlinWasmJs \
            :ui-nav3:compileKotlinIosArm64 \
            :ui-nav3:compileKotlinIosSimulatorArm64 \
            :haptics:compileKotlinJs \
            :haptics:compileKotlinWasmJs \
            :haptics:compileKotlinIosArm64 \
            :haptics:compileKotlinIosSimulatorArm64 \
            :haptics:assemble \
            :showcase:android:assembleDebug \
            :ui:assemble \
            :ui:checkKotlinAbi \
            :ui-nav3:checkKotlinAbi \
            :haptics:checkKotlinAbi \
            :ui:testAndroidHostTest --tests "io.kontour.ui.input.*"

      # `test`'s markers, for this job: see `changes`.
      - id: passed
        name: Mark what passed
        if: needs.changes.result == 'success'
        run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > passed.txt
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.passed.outcome == 'success'
        with: { path: passed.txt, key: "passed-targets-${{ needs.changes.outputs.targets-fp }}" }

      - name: Say what failed
        if: failure()
        run: python3 .github/failed-tests.py >> "$GITHUB_STEP_SUMMARY"

  # Contact sheets, when somebody asks for them.
  #
  # This used to run on every pull request as part of `test`. What it produces is
  # a picture of every page for a person to scroll through — a review artefact,
  # not a gate — and a review artefact nobody has asked for is one nobody reads.
  #
  # It is worth being straight about the size of this: the sweep is about a
  # minute and a half, measured. It was moved out on the strength of a figure
  # that said 23, which came from reading Gradle's `> Task` headers as execution
  # times when they are flush times.
  #
  # So what is given up is not bought back in minutes. The sweep also asserted
  # that every page renders without throwing and that every page drew something,
  # and both have caught shipped defects — a landing page that threw below 600dp,
  # and half the site rendering empty. `SiteRenderTest`'s KDoc has the history.
  renders:
    name: Site contact sheets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.renders }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw every page
        run: ./gradlew --no-daemon :ui-docs:siteRenders

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: site-shots
          path: ui-docs/build/site-shots/
          if-no-files-found: error
          # 76 MB a run, and the point of them is that somebody scrolls through
          # them while the change is fresh: a day.
          retention-days: 1

  # The documentation site, and the API reference it serves under `/api/`.
  #
  # The slowest thing in the repository — a Compose/Wasm bundle plus binaryen.
  # It runs whenever anything the site is made from changed, and on every manual
  # run, so a branch that asks for the checks finds out whether its pages build
  # before it lands. Only the deploy is limited to `main`.
  #
  # Dokka lives here rather than in `targets` because this is the job that
  # *uses* it. It was in both, generating the same HTML twice a run.
  site:
    name: Build the site
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.site-run == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The icons, as at the top.
      packages: read
      # To fetch another run's bundle.
      actions: read
    outputs:
      name: ${{ steps.name.outputs.name }}
      # Whether the upload below made it: `deploy` has nothing to fetch if not.
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # The release tags as refs, not their history: the API reference names the
      # latest release tag as its version (`kontourDocsVersion` in buildSrc)
      # rather than the snapshot a build of `main` is.
      #
      # A step of its own, not `fetch-tags: true` on the checkout, which is what
      # this was and what broke the v0.2.0 and v0.2.1 runs. That option drops
      # the checkout's `--no-tags`, so on a tag push git follows the tag that
      # points at the commit being built into `refs/tags/<tag>` — the ref the
      # checkout is already writing it to — and refuses: "Cannot fetch both
      # <sha> and refs/tags/v0.2.1 to refs/tags/v0.2.1". A push to `main` has no
      # tag on its commit, so only a release ever hit it.
      - name: Fetch the release tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'

      # What this build is, for `deploy` and for a later push of the same
      # inputs to find: see `changes`.
      - id: name
        name: Name the upload
        run: echo "name=site-${{ needs.changes.outputs.docs-fp }}-$(.github/docs-release.sh)" >> "$GITHUB_OUTPUT"

      # The bundle an earlier run built from these same inputs, when there is
      # one: a release tag on `main`'s commit, which wants the reference
      # relabelled and nothing compiled. With the API tables it was built
      # with, which the reference's links are checked against below. One that
      # cannot be fetched — expired since `changes` saw it, or storage having
      # a bad minute — is built here instead, as if there had been none.
      - id: bundle
        name: Fetch the bundle these inputs built
        if: needs.changes.outputs.bundle-run != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ui-docs/build/dist/wasmJs/productionExecutable
            ui-docs/build/generated/apiTables/ApiTables.kt
          key: ${{ needs.changes.outputs.bundle-name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Dokka resolves every source set, the native ones included, so this job
      # wants the same Konan cache `targets` does. Same key, so whichever runs
      # first fills it and the other restores it.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Node is 210 MB and binaryen is 322 MB, and Kotlin downloads both from
      # outside GitHub on every cold run. The measured restore rate for a cache
      # entry in this repository is 360 MB/s from GitHub's own storage, so this
      # is the cheaper half of a straightforward trade.
      #
      # Keyed on the version catalogue rather than on a lockfile because there is
      # no lockfile: `kotlin-js-store` is not committed, and which Node, which
      # yarn and which binaryen get fetched is decided by the Kotlin and Compose
      # versions pinned there.
      #
      # `build/js/node_modules` is deliberately absent. Gradle regenerates the
      # `package.json` files under `build/js` on every run, and a restored
      # `node_modules` that disagreed with a freshly generated manifest would be
      # a confusing failure in exchange for a much smaller saving than these.
      - name: Cache the Kotlin/JS toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/nodejs
            ~/.gradle/yarn
            ~/.gradle/binaryen
          key: kotlin-js-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: kotlin-js-${{ runner.os }}-

      # The prose is generated into Kotlin at build time by
      # `docs/generate-doc-pages.py`, which the Gradle task calls — so a
      # malformed page fails here rather than in a reader's browser.
      - name: Build the site
        if: steps.bundle.outputs.cache-hit != 'true'
        run: ./gradlew --no-daemon :ui-docs:wasmJsBrowserDistribution

      # What a reader downloads, against ceilings that only go down. Cheap — it
      # gzips eleven files and prints a table — and it is the only assertion in
      # the repository on the size of anything, which is why a bundle that had
      # grown to 5.8 MB was never news to anybody.
      #
      # `docs/measure-web.mjs` is the other half and does not run here: it opens
      # a browser, and a timing taken on a shared runner would be a number to
      # ignore. This one is bytes, and bytes are the same everywhere.
      - name: Check the bundle size
        if: steps.bundle.outputs.cache-hit != 'true'
        run: python3 docs/check-bundle-size.py

      # For a later run of the same inputs, in the runners' cache: see
      # `changes`. One unused for a week is evicted, and built again.
      - name: Keep the bundle
        if: steps.bundle.outputs.cache-hit != 'true' && needs.changes.outputs.bundle-name != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ui-docs/build/dist/wasmJs/productionExecutable
            ui-docs/build/generated/apiTables/ApiTables.kt
          key: ${{ needs.changes.outputs.bundle-name }}

      # A gate, not a report: `failOnWarning` is on, so a malformed `@param` or a
      # `[Link]` to a symbol that no longer exists fails the build. That is a
      # class of KDoc defect nothing else here can see.
      - name: Build the API reference
        run: ./gradlew --no-daemon :ui:dokkaGenerateHtml :ui-nav3:dokkaGenerateHtml :haptics:dokkaGenerateHtml

      # Only here, and only in this order: it compares the paths the site
      # derived when it was built against the pages the reference published a
      # step ago, and neither output exists on its own. The site derives rather
      # than reads because this job builds it first, and this is what stops that
      # being a guess — it caught 24 paths for declarations with no page at all
      # the first time it ran.
      - name: Check the API reference links
        run: python3 docs/check-api-links.py

      # The site, the reference under `api/`, the Markdown mirror under `md/`
      # with `llms.txt`, preloads generated from what the build produced — and
      # then the upload, with all of that under `ui/` and Cloudflare's own files
      # at the root. In `docs/lay-out-site.py` rather than inline here, because
      # this used to be thirty lines of shell that only existed on a runner — so
      # the arrangement a reader is actually served could not be produced,
      # inspected or measured anywhere else.
      - name: Lay the site out
        run: python3 docs/lay-out-site.py --out site --api ui/build/dokka/html --deploy dist

      # Into the runners' cache, which `deploy` reads minutes later, and so
      # does a tag on the same commit, which deploys this rather than building
      # it again. It was an artifact, about forty megabytes a run in storage
      # shared with the packages — and when that storage was full, the site
      # never reached `deploy` at all. The cache has a quota of its own.
      #
      # **A save that fails does not fail the job**, here or anywhere else in
      # this file: storage refusing a file is not a defect in the code, and a
      # run that has passed every gate should say so. Here it is a warning, and
      # `deploy` is skipped, having nothing to fetch; the next push that
      # changes the site deploys it. A marker that is not saved means its gate
      # runs again next time.
      - id: upload
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: dist
          key: ${{ steps.name.outputs.name }}
      - name: Say the site was not uploaded
        if: steps.upload.outcome == 'failure'
        run: |
          msg="The site built but could not be saved to the cache, so it is not deployed. Re-run this job, or push again, to deploy it."
          echo "::warning title=Site not uploaded::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  # Cloudflare Pages, Direct Upload, behind Cloudflare Access — see
  # `ui-docs/content/agents.md` for how an agent gets in.
  #
  # From `main`, and from a release tag, so the reference names the new version
  # as soon as it is tagged rather than at the next push to `main`. A manual run
  # on a branch builds the site to prove it builds, and does not replace what is
  # published. Tag the head of `main`: a tag on an older commit would deploy
  # that commit's docs over newer ones.
  #
  # Direct Upload replaces the *whole* Pages project with each deployment, and
  # `docs.kontour.io` is meant to hold more than this library's documentation
  # one day. While it is the only thing there, this upload is the whole site;
  # when a second library's documentation arrives, the upload has to be
  # assembled from both, or each deploy deletes the other's.
  #
  # The project name is a repository variable, so the host can be moved without
  # a commit; unset, it is `kontour-docs`.
  #
  # What it uploads is this run's site, or, when `changes` found this tree's
  # site already built for the same release, that run's.
  deploy:
    name: Deploy
    needs: [changes, site]
    if: >-
      ${{ !cancelled()
        && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        && ((needs.site.result == 'success' && needs.site.outputs.uploaded == 'true')
          || (needs.site.result == 'skipped' && needs.changes.outputs.deploy == 'true'
            && needs.changes.outputs.site-run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: ${{ needs.site.result == 'success' && needs.site.outputs.name || needs.changes.outputs.site-name }}
          fail-on-cache-miss: true

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kontour-docs' }}
            --branch=main
            --commit-hash=${{ github.sha }}

  publish:
    name: Publish
    # Only a release, and only once every gate of `test` and `targets` has
    # passed these inputs: in this run, or in an earlier one that left the
    # markers `changes` found — the pushes to `main` the tag was put on top
    # of, or the branch's manual run before it merged. A job `changes` skipped
    # is one with nothing left to prove; one skipped because `changes` failed
    # is not, and neither is one that failed.
    needs: [changes, test, targets]
    if: >-
      ${{ !cancelled()
        && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
        && (needs.test.result == 'success'
          || (needs.changes.result == 'success' && needs.changes.outputs.test == 'false'))
        && (needs.targets.result == 'success'
          || (needs.changes.result == 'success' && needs.changes.outputs.targets == 'false')) }}
    # Ubuntu, not macOS. This job used to run on `macos-14` on the belief that
    # Apple targets cannot be cross-compiled — but Kotlin 2.x cross-compiles
    # Apple *klibs*, which is exactly what a library consumer resolves. Verified
    # by publishing locally on Linux and reading `native_targets=ios_arm64` out
    # of the resulting klib manifest, rather than by trusting the build to say
    # so. What still needs Xcode is linking a *framework*, and that happens in
    # the consuming app.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Starts from `targets`' Gradle cache rather than its own. The action keys
    # its cache by job and saves only from `main`, where this job never runs,
    # so it had no cache of its own and compiled every target from nothing:
    # 16 of its 17 minutes for v0.3.0, in the run where `targets` compiled
    # the same code in under three, from its cache. This variable is the
    # action's own, undocumented, way to name the job in the key; if it stops
    # working this is a cold build again, which is what it always was.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: targets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Say what is about to be uploaded before uploading it. The version is
      # resolved from three sources with a precedence between them, and a
      # package registry has no undo.
      - name: Show the coordinate
        run: |
          ./gradlew --no-daemon --quiet \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            :ui:coordinate :ui-nav3:coordinate :haptics:coordinate

      # On a tag this takes no version argument and so cannot disagree with the
      # tag: the build reads `GITHUB_REF_TYPE`/`GITHUB_REF_NAME` itself. A manual
      # run supplies one explicitly, which is the only other way to get a
      # publishable version out of that logic.
      #
      # **It compiles nothing.** Every compile in it comes `FROM-CACHE`, from
      # `targets`' Gradle home. It signs every file, uploads the three modules
      # to the Central Portal, and releases them once Central has validated
      # them: `automaticRelease` in each module's `mavenPublishing`.
      # A release is on Maven Central within about half an hour of this step
      # finishing, and cannot be taken back: Central never deletes a version.
      #
      # The four secrets: the Central Portal user token (Account → Generate User
      # Token, at central.sonatype.com) and the signing key, ASCII-armoured, with
      # its passphrase. `docs/building/releasing.md` has how to make them.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            publishAndReleaseToMavenCentral
