# Builds, tests, publishes the design system, and deploys its documentation.
#
# One workflow, and it used to be two. `pages.yml` had its own checkout, its own
# Gradle setup and its own Dokka run, which meant the API reference was generated
# twice on every commit — once in `targets`, which uploaded it as an artifact,
# and again in the site build, which could not reach that artifact because it
# was in a different workflow. Merging them is what makes the reference a thing
# built once by the job that publishes it.
#
# Five jobs, and they are separate because they fail for different reasons and at
# different speeds:
#
#   guard    decides whether main has to re-prove what a pull request already did
#   test     the one that catches a regression
#   targets  the one that catches a component compiling on the JVM and nowhere else
#   site     the documentation site and the API reference, and the slowest thing here
#   deploy   publishes the site to GitHub Pages
#   publish  uploads the library to GitHub Packages, for a release only
#
# `deploy` needs only `site`, deliberately: a library regression should not take
# the documentation offline, and a broken page should not block a release.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish this version to GitHub Packages (e.g. 0.1.0). Leave blank to
          run the checks only. Use this to cut a release from a branch, where
          `GITHUB_REF_NAME` is a branch name and the build refuses it.
        required: false
        default: ''

# Read-only by default. The two jobs that write say so themselves, which is
# tighter than the arrangement this replaced: `pages.yml` granted `pages: write`
# to its build job as well as to its deploy.
permissions:
  contents: read

# A superseded pull request run is cancelled; a superseded push is not. The last
# push to land should be the one that ends up published, and cancelling a deploy
# in flight can leave a newer build racing an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Has this exact tree already passed?
  #
  # Merging a pull request produces a commit whose *tree* is byte-for-byte the
  # branch head's, whenever main has not moved underneath it — and that is true
  # of a merge commit, a squash and a rebase alike. So the work `test` and
  # `targets` would do on main is work that has already been done, on the same
  # bytes, minutes earlier.
  #
  # This is the property a merge queue gives you, arrived at from the other
  # direction: rather than testing the merge result before it lands, notice
  # afterwards that the result is identical to something already tested. It is
  # weaker in one way — main is briefly unverified if the check is wrong — and
  # the answer to that is that every path out of here that cannot *prove* the
  # trees match settles on `false` and runs everything. A direct push, a
  # conflicted merge, main having moved, a missing run, a failed API call: all
  # of them run the full suite.
  guard:
    name: Decide what to re-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      settled: ${{ steps.decide.outputs.settled }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail

          settle() {
            echo "settled=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          [ "$EVENT" = push ] || settle false "A $EVENT event proves nothing about main. Running everything."
          [ "$REF" = refs/heads/main ] || settle false "$REF is not main. Running everything."

          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.sha' 2>/dev/null)
          [ -n "${head:-}" ] && [ "$head" != null ] ||
            settle false "No pull request produced $SHA. Running everything."

          landed=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null) ||
            settle false "Could not read the tree of $SHA. Running everything."
          reviewed=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha 2>/dev/null) ||
            settle false "Could not read the tree of $head. Running everything."
          [ "$landed" = "$reviewed" ] ||
            settle false "main's tree is $landed and ${head:0:7}'s is $reviewed — main moved under it. Running everything."

          passed=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&status=success" \
            --jq '.workflow_runs | length' 2>/dev/null)
          [ "${passed:-0}" -gt 0 ] ||
            settle false "No successful CI run for ${head:0:7}. Running everything."

          settle true "${head:0:7} passed CI and its tree is exactly what landed ($landed). Building the site and deploying only."

  test:
    name: Test
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.settled != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on the runner and Gradle finds it through
      # ANDROID_HOME. `local.properties` is a developer file and is gitignored,
      # so nothing here may rely on it.
      - name: Check the Android SDK is present
        run: test -d "${ANDROID_HOME:?ANDROID_HOME is unset}/platforms"

      # Unit tests, the structural guards, the screenshot goldens and every page
      # of the site at four widths. The goldens *compare* — a rendering change
      # fails here rather than turning up as an untracked file nobody looks at.
      #
      # Named explicitly rather than via `check`: the Compose plugin registers a
      # JS UI-test configuration check that fails for a library target, so
      # `check` does not run to completion on `:ui`.
      - name: Test
        run: |
          ./gradlew --no-daemon \
            :ui:jvmTest \
            :ui:checkNoMaterial \
            :ui:checkApiConventions \
            :ui:checkKdocSamples \
            :ui-catalog:jvmTest \
            :ui-docs:jvmTest

      # The examples on the documentation pages, compiled. `compileKotlinJvm`
      # answers "does this still work against the real API"; `checkDocSamples`
      # answers "is the copy on the page still the code that was compiled".
      # Neither is much use without the other.
      - name: Compile the documentation examples
        run: |
          ./gradlew --no-daemon \
            :ui-samples:compileKotlinJvm \
            :ui-samples:checkDocSamples

      - name: Check the docs' links resolve
        run: python3 docs/check-links.py

      # Ten rules over the documentation: a page per public component, an index
      # entry, an interactive demo, a compiled example, accessibility notes, and
      # a README whose component count is the tree's.
      - name: Check every component has a page
        run: python3 docs/check-components.py

      # Every page of the site at four window widths, with a contact sheet per
      # width. Uploaded on success as well as on failure, because the point of
      # these is that somebody looks at them: `SiteRenderTest` asserts a page
      # renders and drew something, and no assertion it could carry would say
      # "this page reads badly on a phone" — which is what the complaint that
      # started Round 16 actually was.
      - name: Upload the site renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-shots
          path: ui-docs/build/site-shots/
          if-no-files-found: ignore

      # Without this a golden failure is a percentage in a log. With it you can
      # download the render and the highlighted diff and see what moved.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: ui-catalog/build/screenshot-diffs/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ui/build/reports/tests/
            ui-catalog/build/reports/tests/
          if-no-files-found: ignore

  targets:
    name: Compile every target
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.settled != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Konan pulls a compiler and a platform klib set per target and neither is
      # in the Gradle cache, so without this the iOS compile re-downloads
      # hundreds of megabytes on every run — which is most of this job's time.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The whole point of the module. A component that compiles on the JVM and
      # not on Wasm ships broken, and `commonMain` will not say which — only the
      # per-target compile does.
      #
      # iOS compiles to a klib here; linking a framework and running a simulator
      # needs macOS, which is a slower job than this gate should be.
      - name: Compile
        run: |
          ./gradlew --no-daemon \
            :ui:compileKotlinJs \
            :ui:compileKotlinWasmJs \
            :ui:compileKotlinIosArm64 \
            :ui-catalog:compileKotlinIosArm64 \
            :showcase:android:assembleDebug \
            :ui:assemble

  # The documentation site, and the API reference it serves under `/api/`.
  #
  # The slowest thing in the repository — a Compose/Wasm bundle plus binaryen —
  # and it runs on pull requests too. A site built only on `main` makes the
  # deploy the first place it is ever compiled, so the first anyone hears of a
  # broken page is after it has landed. The build runs everywhere; only the
  # deploy is gated.
  #
  # Dokka lives here rather than in `targets` because this is the job that
  # *uses* it. It was in both, generating the same HTML twice a run.
  site:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Dokka resolves every source set, the native ones included, so this job
      # wants the same Konan cache `targets` does. Same key, so whichever runs
      # first fills it and the other restores it.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Node is 210 MB and binaryen is 322 MB, and Kotlin downloads both from
      # outside GitHub on every cold run. The measured restore rate for a cache
      # entry in this repository is 360 MB/s from GitHub's own storage, so this
      # is the cheaper half of a straightforward trade.
      #
      # Keyed on the version catalogue rather than on a lockfile because there is
      # no lockfile: `kotlin-js-store` is not committed, and which Node, which
      # yarn and which binaryen get fetched is decided by the Kotlin and Compose
      # versions pinned there.
      #
      # `build/js/node_modules` is deliberately absent. Gradle regenerates the
      # `package.json` files under `build/js` on every run, and a restored
      # `node_modules` that disagreed with a freshly generated manifest would be
      # a confusing failure in exchange for a much smaller saving than these.
      - name: Cache the Kotlin/JS toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/nodejs
            ~/.gradle/yarn
            ~/.gradle/binaryen
          key: kotlin-js-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: kotlin-js-${{ runner.os }}-

      # The prose is generated into Kotlin at build time by
      # `docs/generate-doc-pages.py`, which the Gradle task calls — so a
      # malformed page fails here rather than in a reader's browser.
      - name: Build the site
        run: ./gradlew --no-daemon :ui-docs:wasmJsBrowserDistribution

      # A gate, not a report: `failOnWarning` is on, so a malformed `@param` or a
      # `[Link]` to a symbol that no longer exists fails the build. That is a
      # class of KDoc defect nothing else here can see.
      - name: Build the API reference
        run: ./gradlew --no-daemon :ui:dokkaGenerateHtml

      # Site at the root, reference under `/api/`. Laid out here rather than by
      # a Gradle copy task, because this arrangement is a fact about the
      # deployment and not about the build.
      - name: Lay the site out
        run: |
          mkdir -p site
          cp -r ui-docs/build/dist/wasmJs/productionExecutable/. site/
          # The Wasm compiler emits a source map beside the binary whatever
          # webpack is told, and `cp -r .` takes everything. 281 KB of it,
          # fetched by nobody.
          find site -name '*.map' -delete
          mkdir -p site/api
          cp -r ui/build/dokka/html/. site/api/
          # Pages runs the whole tree through Jekyll unless told not to, and
          # Jekyll drops files and directories beginning with an underscore —
          # which is most of what a webpack bundle emits.
          touch site/.nojekyll
          test -f site/index.html
          test -f site/api/index.html

          # Every preload has to name a file that is really there. A preload
          # pointing at nothing is silent: the browser fetches it, gets a 404,
          # and the page still works — just without the head start it was the
          # whole point of. The bundle's filenames are a convention of the
          # Kotlin plugin rather than a promise, so they are checked rather
          # than trusted.
          grep -o 'rel="preload" href="[^"]*"' site/index.html \
            | sed 's/.*href="//; s/"$//' \
            | while read -r asset; do
                test -f "site/$asset" || {
                  echo "index.html preloads $asset, which the build did not produce" >&2
                  exit 1
                }
              done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The reference on its own, for anyone who wants to read it without the
      # site around it.
      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: ui/build/dokka/html/
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: site
    # A pull request builds the site to prove it still builds; it does not
    # replace what is published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish
    # Only a release, so `guard` never settles it — a tag push is not a pull
    # request merge, and `test` and `targets` therefore always run first.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [test, targets]
    # Ubuntu, not macOS. This job used to run on `macos-14` on the belief that
    # Apple targets cannot be cross-compiled — but Kotlin 2.x cross-compiles
    # Apple *klibs*, which is exactly what a library consumer resolves. Verified
    # by publishing locally on Linux and reading `native_targets=ios_arm64` out
    # of the resulting klib manifest, rather than by trusting the build to say
    # so. What still needs Xcode is linking a *framework*, and that happens in
    # the consuming app.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Say what is about to be uploaded before uploading it. The version is
      # resolved from three sources with a precedence between them, and a
      # package registry has no undo.
      - name: Show the coordinate
        run: |
          ./gradlew --no-daemon --quiet \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            :ui:coordinate

      # On a tag this takes no version argument and so cannot disagree with the
      # tag: the build reads `GITHUB_REF_TYPE`/`GITHUB_REF_NAME` itself. A manual
      # run supplies one explicitly, which is the only other way to get a
      # publishable version out of that logic.
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            publishAllPublicationsToGitHubPackagesRepository
