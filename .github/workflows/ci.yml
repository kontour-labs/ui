# Builds, tests and publishes the design system.
#
# Three jobs, and they are separate because they fail for different reasons and
# at different speeds. `test` is the one that catches a regression; `targets` is
# the one that catches a component which compiles on the JVM and nowhere else;
# `publish` uploads to GitHub Packages and runs only for a release — a `v*` tag,
# or a manual run given a version.
#
# All three run on Linux, `publish` included. It used to be pinned to macOS on
# the belief that Apple targets cannot be cross-compiled, which is true of a
# *framework* and not of a klib — and a klib is what a library consumer
# resolves. See the job for how that was checked.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish this version to GitHub Packages (e.g. 0.1.0). Leave blank to
          run the checks only. Use this to cut a release from a branch, where
          `GITHUB_REF_NAME` is a branch name and the build refuses it.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The Android SDK is preinstalled on the runner and Gradle finds it through
      # ANDROID_HOME. `local.properties` is a developer file and is gitignored,
      # so nothing here may rely on it.
      - name: Check the Android SDK is present
        run: test -d "${ANDROID_HOME:?ANDROID_HOME is unset}/platforms"

      # Unit tests, the four structural guards, and the screenshot goldens. The
      # goldens *compare* — a rendering change fails here rather than turning up
      # as an untracked file nobody looks at.
      #
      # Named explicitly rather than via `check`: the Compose plugin registers a
      # JS UI-test configuration check that fails for a library target, so
      # `check` does not run to completion on `:ui`.
      - name: Test
        run: |
          ./gradlew --no-daemon \
            :ui:jvmTest \
            :ui:checkNoMaterial \
            :ui:checkApiConventions \
            :ui:checkKdocSamples \
            :ui-catalog:jvmTest

      # The examples on the documentation pages, compiled. `compileKotlinJvm`
      # answers "does this still work against the real API"; `checkDocSamples`
      # answers "is the copy on the page still the code that was compiled".
      # Neither is much use without the other.
      - name: Compile the documentation examples
        run: |
          ./gradlew --no-daemon \
            :ui-samples:compileKotlinJvm \
            :ui-samples:checkDocSamples

      - name: Check the docs' links resolve
        run: python3 docs/check-links.py

      # Without this a golden failure is a percentage in a log. With it you can
      # download the render and the highlighted diff and see what moved.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: ui-catalog/build/screenshot-diffs/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ui/build/reports/tests/
            ui-catalog/build/reports/tests/
          if-no-files-found: ignore

  targets:
    name: Compile every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Konan pulls a compiler and a platform klib set per target and neither is
      # in the Gradle cache, so without this the iOS compile re-downloads
      # hundreds of megabytes on every run — which is most of this job's time.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The whole point of the module. A component that compiles on the JVM and
      # not on Wasm ships broken, and `commonMain` will not say which — only the
      # per-target compile does.
      #
      # iOS compiles to a klib here; linking a framework and running a simulator
      # needs macOS, which is a slower job than this gate should be.
      - name: Compile
        run: |
          ./gradlew --no-daemon \
            :ui:compileKotlinJs \
            :ui:compileKotlinWasmJs \
            :ui:compileKotlinIosArm64 \
            :ui-catalog:compileKotlinIosArm64 \
            :showcase:android:assembleDebug \
            :ui:assemble

      # The API reference. Here rather than in `test` because Dokka resolves
      # every source set including the native ones, and this is the job with the
      # Konan cache.
      #
      # It is not published yet, and generating it anyway is the point: Dokka
      # fails on a malformed `@param` or a `[Link]` to a symbol that no longer
      # exists, which is a class of KDoc defect nothing else here can see.
      - name: Generate the API reference
        run: ./gradlew --no-daemon :ui:dokkaGenerateHtml

      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: ui/build/dokka/html/
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [test, targets]
    # Ubuntu, not macOS. This job used to run on `macos-14` on the belief that
    # Apple targets cannot be cross-compiled — but Kotlin 2.x cross-compiles
    # Apple *klibs*, which is exactly what a library consumer resolves. Verified
    # by publishing locally on Linux and reading `native_targets=ios_arm64` out
    # of the resulting klib manifest, rather than by trusting the build to say
    # so. What still needs Xcode is linking a *framework*, and that happens in
    # the consuming app.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Say what is about to be uploaded before uploading it. The version is
      # resolved from three sources with a precedence between them, and a
      # package registry has no undo.
      - name: Show the coordinate
        run: |
          ./gradlew --no-daemon --quiet \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            :ui:coordinate

      # On a tag this takes no version argument and so cannot disagree with the
      # tag: the build reads `GITHUB_REF_TYPE`/`GITHUB_REF_NAME` itself. A manual
      # run supplies one explicitly, which is the only other way to get a
      # publishable version out of that logic.
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon \
            ${{ inputs.version && format('-Pkontour.version={0}', inputs.version) || '' }} \
            publishAllPublicationsToGitHubPackagesRepository
