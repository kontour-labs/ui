# Builds the documentation site and publishes it to GitHub Pages.
#
# Separate from `ci.yml` on the reasoning that file already gives for its three
# jobs: this fails for a different reason and at a different speed, and a broken
# site should not fail a library release. It is also the slowest thing in the
# repository — a Compose/Wasm bundle plus binaryen — and nothing else has to
# wait for it.
#
# What gets deployed:
#
#   /          the site: a page per component, prose beside the running component
#   /api/      the Dokka reference
#
# The site routes on the URL fragment (`#/components/button`) precisely so that
# a host with no rewrite rules serves every deep link from one `index.html`.
# GitHub Pages has no rewrite rules.

name: Pages

# Built on pull requests as well as on the pushes that deploy. A workflow that
# only runs on `main` makes the deploy the first place the site is ever
# compiled, so the first anyone hears of a broken page is after it has landed —
# and this is the slowest thing in the repository to find out about late.
# The build runs everywhere; only the deploy is gated.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# `pages: write` and `id-token: write` are what `deploy-pages` needs to claim
# the environment; `contents: read` is the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one is not cancelled: the last push to
# land should be the one that ends up published, and cancelling in progress can
# leave the newer build racing the older one. Pull requests get their own group
# per ref, where cancelling a superseded run is exactly what you want.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The prose is generated into Kotlin at build time by
      # `docs/generate-doc-pages.py`, which the Gradle task calls — so a
      # malformed page fails here rather than in a reader's browser.
      - name: Build the site
        run: ./gradlew --no-daemon :ui-docs:wasmJsBrowserDistribution

      - name: Build the API reference
        run: ./gradlew --no-daemon :ui:dokkaGenerateHtml

      # Site at the root, reference under `/api/`. Laid out here rather than by
      # a Gradle copy task, because this arrangement is a fact about the
      # deployment and not about the build.
      - name: Lay the site out
        run: |
          mkdir -p site
          cp -r ui-docs/build/dist/wasmJs/productionExecutable/. site/
          mkdir -p site/api
          cp -r ui/build/dokka/html/. site/api/
          # Pages runs the whole tree through Jekyll unless told not to, and
          # Jekyll drops files and directories beginning with an underscore —
          # which is most of what a webpack bundle emits.
          touch site/.nojekyll
          test -f site/index.html
          test -f site/api/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    # A pull request builds the site to prove it still builds; it does not
    # replace what is published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
