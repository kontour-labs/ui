<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontour UI</title>
    <meta name="description" content="A Compose Multiplatform design system.">
    <link type="text/css" rel="stylesheet" href="styles.css">

    <!--
      The wasm preloads are not here. They are injected by the `Lay the site out`
      step in `.github/workflows/ci.yml`, one per binary the distribution turns
      out to contain.

      They started here, hardcoded, and one of them was wrong: `skiko.wasm` is a
      real file at `build/compose/skiko-for-web-runtime/skiko.wasm`, which is an
      *intermediate* directory — webpack does not necessarily emit it into the
      distribution under that name, or at that path, or at all. The build's own
      preload check caught it, which is the only reason it is not still shipping
      as a silent 404: a preload that misses is invisible, because the browser
      fetches it, gets nothing, and the page still works — just without the head
      start that was the entire point.

      So the filenames are read off the build rather than predicted. Whatever
      webpack decides to call the binaries, including a content hash, the tags
      name them correctly.
    -->

    <!--
      The two faces that draw the first screen: body text and the page heading.
      The other three arrive with the rest of the bundle. Every face is fetched
      separately after boot, and until one lands its text is measured with a
      fallback and re-laid-out when it arrives — so preloading the two that are
      always on screen removes two of those waves.
    -->
    <link rel="preload" href="composeResources/io.kontour.ui.generated.resources/font/outfit_regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="composeResources/io.kontour.ui.generated.resources/font/outfit_semibold.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
    <!--
      Shown until the bundle boots and Compose paints over it.

      A Compose/Wasm bundle is several megabytes and the first load is not
      instant. One bundle serves every route, so it is paid once — but the first
      few seconds are a blank page unless something stands in, and a blank page
      is indistinguishable from a broken one.
    -->
    <div id="booting">
        <h1>Kontour UI</h1>
        <p>Loading the component library…</p>
    </div>
    <script type="application/javascript" src="ui-docs.js" defer></script>
</body>
</html>
