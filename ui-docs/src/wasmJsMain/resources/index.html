<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontour UI</title>
    <meta name="description" content="A Compose Multiplatform design system.">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!--
      Skia's functions reach the app through a plain JavaScript call, not
      straight from one WebAssembly module into the other.

      Safari on iOS 27.2 links a Kotlin/Wasm module's imports from Skia's module
      directly, and after a few hundred calls the floating-point arguments
      arrive wrong: a blur of sigma 10.9 came back from Skia as nothing, and
      text measured to nothing, so a screen's controls piled up in its top left
      corner. Found on an iPhone in November 2026, and only there; Chrome,
      Firefox and Safari on a Mac never did it. A call through JavaScript in
      between never goes wrong, so each of Skia's imports is wrapped in one
      before the app is instantiated, in every browser rather than only the one
      that needs it. installing.md, "Safari on iOS", has the same script for an
      app's own page.
    -->
    <script>
        (function () {
            function viaJs(imports) {
                if (!imports || typeof imports !== "object") return imports;
                var out = {}, changed = false;
                Object.keys(imports).forEach(function (name) {
                    var module = imports[name];
                    if (name.indexOf("skiko") < 0 || !module || typeof module !== "object") { out[name] = module; return; }
                    var wrapped = {};
                    Object.keys(module).forEach(function (key) {
                        var f = module[key];
                        wrapped[key] = typeof f === "function" ? function () { return f.apply(null, arguments); } : f;
                    });
                    out[name] = wrapped;
                    changed = true;
                });
                return changed ? out : imports;
            }
            var instantiate = WebAssembly.instantiate;
            WebAssembly.instantiate = function (source, imports) { return instantiate.call(WebAssembly, source, viaJs(imports)); };
            var streaming = WebAssembly.instantiateStreaming;
            if (streaming) WebAssembly.instantiateStreaming = function (source, imports) { return streaming.call(WebAssembly, source, viaJs(imports)); };
        })();
    </script>

    <!--
      The preloads are not here. Every one of them is generated by
      `docs/lay-out-site.py`, from what the build actually produced.

      Two of them used to be written by hand, and both went wrong in ways that
      are invisible from the page. One named `skiko.wasm` at
      `build/compose/skiko-for-web-runtime/skiko.wasm`, an *intermediate*
      directory webpack does not necessarily emit under that name, at that path,
      or at all — so it 404ed, and the page still worked, just without the head
      start that was the entire point. The other two named the right files and
      declared them `as="font"`, which cannot match how they are fetched, so the
      browser downloaded both a second time.

      A preload that misses is silent by construction. So the filenames come off
      the build, the `as` comes from how the bundle loads things, and the script
      refuses to write a tag it cannot verify.
    -->
</head>
<body>
    <!--
      Shown until the bundle boots and Compose paints over it.

      A Compose/Wasm bundle is several megabytes and the first load is not
      instant. One bundle serves every route, so it is paid once — but the first
      few seconds are a blank page unless something stands in, and a blank page
      is indistinguishable from a broken one.
    -->
    <div id="booting">
        <h1>Kontour UI</h1>
        <p>Loading the component library…</p>
    </div>
    <script type="application/javascript" src="ui-docs.js" defer></script>
</body>
</html>
